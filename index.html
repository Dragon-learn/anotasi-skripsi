<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Alat Anotasi Gambar Skripsi</title>
<style>
:root{color-scheme:light dark;--a:#2563eb;--b:#8888}
*{box-sizing:border-box}
body{margin:0;font:14px system-ui,sans-serif;background:Canvas;color:CanvasText}
#banner{padding:8px 12px;background:#f59e0b;color:#000;display:flex;gap:8px;align-items:center}
#banner[hidden]{display:none}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--b)}
.selector-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:rgba(0,0,0,.03);border-bottom:1px solid var(--b)}
.select-box{display:flex;align-items:center;padding:4px 8px;border:1px solid var(--b);border-radius:6px;background:Canvas}
.select-box.active{border-color:var(--a);background:rgba(37,99,235,.12);box-shadow:0 0 0 1px var(--a)}
.select-box select{font:inherit;border:none;background:transparent;color:CanvasText;outline:none;padding:2px;max-width:46vw}
main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:12px;padding:12px;height:calc(100vh - 130px)}
#img{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--b);border-radius:8px;overflow:hidden;min-height:0;text-align:center;padding:8px;touch-action:pan-y}
#img img{max-width:100%;max-height:78%;object-fit:contain}
#meta-info{font-size:12px;margin-top:6px;padding:6px 10px;background:rgba(37,99,235,.1);border-left:3px solid var(--a);border-radius:4px;max-width:100%;word-break:break-word;text-align:left}
#form{overflow:auto;padding-right:4px}
fieldset{border:1px solid var(--b);border-radius:8px;margin:0 0 8px;padding:6px 8px}
legend{font-weight:600;padding:0 4px}
.o,.m{display:flex;flex-wrap:wrap;gap:4px}
button{font:inherit;border:1px solid var(--b);border-radius:6px;padding:6px 10px;background:Canvas;color:CanvasText;cursor:pointer;touch-action:manipulation}
.primary{background:var(--a);color:#fff;border-color:var(--a)}
.o button.on{background:var(--a);color:#fff;border-color:var(--a)}
.m button{width:36px;height:36px;padding:0;font-weight:700}
.m button.on{outline:3px solid var(--a);outline-offset:1px}
textarea{width:100%;font:inherit;background:Canvas;color:CanvasText;border:1px solid var(--b);border-radius:6px}
#name{font-weight:600;margin-bottom:4px}
@media(max-width:800px){main{grid-template-columns:1fr;height:auto}#img{height:50vh}}
</style>
</head>
<body>
<div id="banner" hidden>Versi baru alat ini tersedia. <button id="reload" class="primary">Muat ulang</button></div>
<header>
  <label><input id="blind" type="checkbox"> Mode buta</label>
  <span id="prog"></span><span id="total"></span><span id="ver" style="opacity:.6;font-size:11px"></span><span style="flex:1"></span>
  <button id="prev" title="Sebelumnya">&larr;</button><button id="next" title="Berikutnya">&rarr;</button>
  <button id="exp" class="primary">Ekspor Excel</button>
</header>
<div class="selector-bar">
  <b>Folder:</b>
  <div class="select-box" id="box-model"><select id="sel-model"></select></div>
  <div class="select-box" id="box-kat"><select id="sel-kat" disabled></select></div>
  <div class="select-box" id="box-prompt"><select id="sel-prompt" disabled></select></div>
  <button id="btn-load" class="primary" disabled>Muat Gambar</button>
  <button id="btn-tree" title="Ambil ulang daftar gambar dari repo">Daftar ulang</button>
</div>
<main>
  <div id="img"><span>Pilih Model, Kategori, dan Prompt, lalu tekan "Muat Gambar".</span><div id="meta-info" style="display:none"></div></div>
  <div id="form"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const VERSI='2026-10-30-b', REPO='Dragon-learn/anotasi-skripsi';
const LS='anotasi_v3', LT='tree_v1', LL='last_v1';
const S={
  Gender:['Perempuan','Laki-laki'],
  Usia:['Dewasa Muda','Dewasa Tua'],
  Pakaian_Kategori:['Batik tradisional (kasual)','Batik formal (jas/kemeja/dasi)','Formal modern tanpa batik','Seragam/pakaian kerja','Netral/kasual polos'],
  Latar_Kategori:['Pasar tradisional','Pusat perniagaan/pertokoan','Perkotaan (luar ruang)','Kantor/ruang kerja','Kafe/restoran','Aula/ruang publik','Konstruksi/industri','Laboratorium/fasilitas medis','Pedesaan','Pertanian/perkebunan/perairan','Rumah tinggal','Bangunan tradisional'],
  Penanda_Keagamaan:['Hijab','Peci','Peci + Sarung','Sarung','Tidak ada']
};
const SW=['f6ede4','f3e7db','f7ead0','eadaba','d7bd96','a07e56','825c43','604134','3a312a','292420'];
const $=id=>document.getElementById(id);
const jget=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let raw=[],items=[],order=[],pos=0,ann=jget(LS,{});
const parts=p=>p.split('/');
const bl=()=>$('blind').checked, mk=()=>bl()?'MST_buta':'MST';
const cur=()=>items[order[pos]];
const rec=it=>ann[it.key]||(ann[it.key]={});
const full=x=>!!(x&&x.MST&&x.Gender&&x.Usia&&x.Pakaian_Kategori&&x.Latar_Kategori&&x.Penanda_Keagamaan);
const doneKey=k=>bl()?!!(ann[k]&&ann[k].MST_buta):full(ann[k]);
const uniq=a=>[...new Set(a)].filter(Boolean);
const save=()=>{jset(LS,ann);labels()};
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- indikator real-time ---------- */
function flag(){[['sel-model','box-model'],['sel-kat','box-kat'],['sel-prompt','box-prompt']].forEach(([s,b])=>$(b).classList.toggle('active',!!$(s).value))}
function cnt(f){const l=raw.filter(f);return l.filter(n=>doneKey(n.path)).length+'/'+l.length}
function labels(){
  const m=$('sel-model').value,k=$('sel-kat').value;
  [...$('sel-model').options].forEach(o=>{if(o.value)o.textContent=o.value+' ('+cnt(n=>parts(n.path)[1]===o.value)+')'});
  [...$('sel-kat').options].forEach(o=>{if(o.value)o.textContent=o.value+' ('+cnt(n=>{const p=parts(n.path);return p[1]===m&&p[2]===o.value})+')'});
  [...$('sel-prompt').options].forEach(o=>{if(o.value)o.textContent=o.value+' ('+cnt(n=>{const p=parts(n.path);return p[1]===m&&p[2]===k&&p[3]===o.value})+')'});
  $('total').textContent=raw.length?'Total: '+raw.filter(n=>doneKey(n.path)).length+'/'+raw.length:'';
  $('prog').textContent=items.length?'Folder: '+items.filter(i=>doneKey(i.key)).length+'/'+items.length:'';
  flag();
}

/* ---------- daftar gambar ---------- */
async function loadTree(force){
  let tree=jget(LT,null);
  if(!tree||force){
    try{
      let r=await fetch('./manifest.json',{cache:'no-store'});
      if(r.ok){tree=await r.json()}
      else{
        r=await fetch('https://api.github.com/repos/'+REPO+'/git/trees/main?recursive=1',{cache:'no-store'});
        const d=await r.json();
        if(!d.tree)throw new Error(d.message||'daftar kosong (batas API GitHub?)');
        tree=d.tree.filter(n=>n.type==='blob').map(n=>n.path);
      }
      jset(LT,tree);
    }catch(e){
      if(!tree){alert('Gagal memuat daftar gambar: '+e.message+'. Coba lagi nanti, atau tambahkan manifest.json ke repo.');return}
      alert('Memakai daftar tersimpan karena: '+e.message);
    }
  }
  raw=tree.filter(p=>p.startsWith('Sample/')&&/\.(png|jpe?g|webp)$/i.test(p)).map(p=>({path:p}));
  const f=(sel,vals,ph)=>{$(sel).innerHTML='<option value="">'+ph+'</option>'+vals.map(v=>'<option value="'+v+'">'+v+'</option>').join('')};
  f('sel-model',uniq(raw.map(n=>parts(n.path)[1])),'-- Model --');
  f('sel-kat',[],'-- Kategori --');f('sel-prompt',[],'-- Prompt --');
  $('sel-kat').disabled=$('sel-prompt').disabled=$('btn-load').disabled=true;
  labels();
}
$('sel-model').onchange=()=>{
  const m=$('sel-model').value;
  $('sel-kat').innerHTML='<option value="">-- Kategori --</option>'+uniq(raw.filter(n=>parts(n.path)[1]===m).map(n=>parts(n.path)[2])).map(v=>'<option value="'+v+'">'+v+'</option>').join('');
  $('sel-prompt').innerHTML='<option value="">-- Prompt --</option>';
  $('sel-kat').disabled=!m;$('sel-prompt').disabled=true;$('btn-load').disabled=true;labels();
};
$('sel-kat').onchange=()=>{
  const m=$('sel-model').value,k=$('sel-kat').value;
  $('sel-prompt').innerHTML='<option value="">-- Prompt --</option>'+uniq(raw.filter(n=>{const p=parts(n.path);return p[1]===m&&p[2]===k}).map(n=>parts(n.path)[3])).map(v=>'<option value="'+v+'">'+v+'</option>').join('');
  $('sel-prompt').disabled=!k;$('btn-load').disabled=true;labels();
};
$('sel-prompt').onchange=()=>{$('btn-load').disabled=!$('sel-prompt').value;labels()};
$('btn-tree').onclick=()=>loadTree(true);

function loadFolder(start){
  const m=$('sel-model').value,k=$('sel-kat').value,q=$('sel-prompt').value;
  items=raw.filter(n=>{const p=parts(n.path);return p[1]===m&&p[2]===k&&p[3]===q}).sort((a,b)=>a.path.localeCompare(b.path)).map(n=>{
    const p=parts(n.path);
    return{path:n.path,key:n.path,name:p[p.length-1],url:encodeURI('./'+n.path),model:p[1],kategori:p[2],prompt:p[3]};
  });
  pos=start||0;build();render();
}
$('btn-load').onclick=()=>loadFolder(0);

/* ---------- penilaian ---------- */
function build(){
  order=items.map((_,i)=>i);
  if(bl()){const r=rng(2026);for(let i=order.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}
  const rank=new Map(order.map((v,i)=>[v,i]));
  items.forEach((it,i)=>it.kode='K'+String(rank.get(i)+1).padStart(3,'0'));
  pos=Math.min(pos,Math.max(order.length-1,0));
}
const grp=(t,c,h)=>'<fieldset><legend>'+t+'</legend><div class="'+c+'">'+h+'</div></fieldset>';
function render(){
  const it=cur(),box=$('img'),meta=$('meta-info');
  if(!it){$('form').innerHTML='';labels();return}
  const x=ann[it.key]||{},k=mk();
  box.querySelectorAll('img').forEach(i=>i.remove());
  const im=document.createElement('img');im.alt='';im.src=it.url;box.insertBefore(im,meta);
  box.firstElementChild&&box.firstElementChild.tagName==='SPAN'&&box.firstElementChild.remove();
  meta.style.display='block';
  meta.textContent='Folder aktif: '+it.model+' > '+it.kategori+' > '+it.prompt;
  let h='<div id="name"></div>';
  h+=grp(bl()?'MST buta (tombol 1-9, 0 untuk 10)':'MST (tombol 1-9, 0 untuk 10)','m',SW.map((c,i)=>'<button data-k="'+k+'" data-v="'+(i+1)+'" class="'+(x[k]==i+1?'on':'')+'" style="background:#'+c+';color:'+(i<5?'#222':'#fff')+'">'+(i+1)+'</button>').join(''));
  if(!bl()){
    for(const f in S)h+=grp(f.replace(/_/g,' '),'o',S[f].map(v=>'<button data-k="'+f+'" data-v="'+v+'" class="'+(x[f]===v?'on':'')+'">'+v+'</button>').join(''));
    h+='<fieldset><legend>Lainnya</legend><label><input type="checkbox" id="mo"> Gambar berisi beberapa orang</label><textarea id="cat" rows="2" placeholder="Catatan"></textarea></fieldset>';
  }
  $('form').innerHTML=h;
  $('name').textContent=(doneKey(it.key)?'\u2713 ':'\u2022 ')+(bl()?it.kode:it.name)+'  ('+(pos+1)+'/'+order.length+')';
  if(!bl()){
    $('mo').checked=x.Multi_Orang==='Ya';$('cat').value=x.Catatan||'';
    $('mo').onchange=e=>{rec(it).Multi_Orang=e.target.checked?'Ya':'Tidak';save()};
    $('cat').oninput=e=>{rec(it).Catatan=e.target.value;save()};
  }
  jset(LL,{m:it.model,k:it.kategori,p:it.prompt,pos,blind:bl()});
  labels();
}
function setVal(k,v){const it=cur();if(!it)return;const r=rec(it);r[k]=r[k]==v?'':v;if(k==='MST_buta')r.Kode=it.kode;save();render()}
function go(d){if(!items.length)return;pos=(pos+d+order.length)%order.length;render()}
$('blind').onchange=()=>{build();render()};
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('form').onclick=e=>{const b=e.target.closest('button[data-k]');if(b)setVal(b.dataset.k,b.dataset.k.startsWith('MST')?+b.dataset.v:b.dataset.v)};
document.addEventListener('keydown',e=>{
  if(['TEXTAREA','INPUT','SELECT'].includes(e.target.tagName)||e.ctrlKey||e.metaKey)return;
  if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
  else if(/^[0-9]$/.test(e.key))setVal(mk(),e.key==='0'?10:+e.key);
});
let sx=null;
$('img').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
$('img').addEventListener('touchend',e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(d)>60)go(d<0?1:-1)},{passive:true});

/* ---------- ekspor semua folder ---------- */
function rows(){
  const keys=new Set([...raw.map(n=>n.path),...Object.keys(ann)]);
  return [...keys].map(k=>{
    const p=parts(k),x=ann[k]||{},pk=x.Pakaian_Kategori||'',ag=x.Penanda_Keagamaan||'',name=p[p.length-1];
    return{Path_File:k,Model:p[1]||'',Kategori_Prompt:p[2]||'',Prompt_Folder:p[3]||'',ID_Gambar:name.replace(/\.[^.]+$/,''),Kode:x.Kode||'',
      Gender:x.Gender||'',Usia:x.Usia||'',MST:x.MST||'',MST_buta:x.MST_buta||'',Pakaian_Kategori:pk,Batik:pk?(pk.startsWith('Batik')?'Ya':'Tidak'):'',
      Latar_Kategori:x.Latar_Kategori||'',Penanda_Keagamaan:ag,Penanda_Islam:ag?(ag==='Tidak ada'?'Tidak':'Ya'):'',Multi_Orang:x.Multi_Orang||'Tidak',Catatan:x.Catatan||''};
  }).sort((a,b)=>a.Path_File.localeCompare(b.Path_File));
}
$('exp').onclick=()=>{
  const r=rows();if(!r.length)return;
  if(window.XLSX){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),'Anotasi');XLSX.writeFile(wb,'anotasi_kategori.xlsx')}
  else{const c=Object.keys(r[0]),q=v=>'"'+String(v).replace(/"/g,'""')+'"';
    const csv='sep=;\r\n'+[c.join(';')].concat(r.map(o=>c.map(k=>q(o[k])).join(';'))).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='anotasi_kategori.csv';a.click()}
};

/* ---------- deteksi versi baru dan pemulihan posisi ---------- */
$('ver').textContent='v'+VERSI;
$('reload').onclick=()=>{location.href=location.pathname+'?v='+Date.now()};
fetch(location.pathname,{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=t.match(/const VERSI='([^']+)'/);if(m&&m[1]!==VERSI)$('banner').hidden=false}).catch(()=>{});
(async()=>{
  await loadTree(false);
  const l=jget(LL,null);
  if(l&&raw.length){
    $('blind').checked=!!l.blind;
    $('sel-model').value=l.m;$('sel-model').onchange();
    $('sel-kat').value=l.k;$('sel-kat').onchange();
    $('sel-prompt').value=l.p;$('sel-prompt').onchange();
    if($('sel-prompt').value===l.p)loadFolder(l.pos||0);
  }
})();
</script>
</body>
</html>
